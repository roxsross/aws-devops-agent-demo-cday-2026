AWSTemplateFormatVersion: '2010-09-09'
Description: 'Servidor MCP de AWS Billing & Cost Management - Lambda + API Gateway'

Parameters:
  S3Bucket:
    Type: String
    Description: Bucket de S3 que contiene el paquete de despliegue del Lambda
  S3Key:
    Type: String
    Description: Clave de S3 del zip con el paquete de despliegue del Lambda
  AwsRegionName:
    Type: String
    Default: 'us-east-1'
    Description: Región de AWS para las llamadas a las APIs de facturación

Resources:
  # Rol de ejecución del Lambda
  McpLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bcm-mcp-server-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BillingReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CostExplorerReadOnly
                Effect: Allow
                Action:
                  - ce:Get*
                  - ce:Describe*
                  - ce:List*
                Resource: '*'
              - Sid: BudgetsReadOnly
                Effect: Allow
                Action:
                  - budgets:Describe*
                  - budgets:View*
                Resource: '*'
              - Sid: ComputeOptimizerReadOnly
                Effect: Allow
                Action:
                  - compute-optimizer:Get*
                Resource: '*'
              - Sid: CostOptimizationHubReadOnly
                Effect: Allow
                Action:
                  - cost-optimization-hub:List*
                  - cost-optimization-hub:Get*
                Resource: '*'
              - Sid: PricingReadOnly
                Effect: Allow
                Action:
                  - pricing:GetProducts
                  - pricing:DescribeServices
                  - pricing:GetAttributeValues
                Resource: '*'
              - Sid: FreeTierReadOnly
                Effect: Allow
                Action:
                  - freetier:GetFreeTierUsage
                Resource: '*'
              - Sid: BillingConductorReadOnly
                Effect: Allow
                Action:
                  - billingconductor:List*
                  - billingconductor:Get*
                Resource: '*'
              - Sid: BillingReadOnly
                Effect: Allow
                Action:
                  - billing:Get*
                  - billing:List*
                Resource: '*'
              - Sid: BcmPricingCalcReadOnly
                Effect: Allow
                Action:
                  - bcm-pricing-calculator:Get*
                  - bcm-pricing-calculator:List*
                Resource: '*'
              - Sid: StorageLensAthena
                Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                Resource: !Sub 'arn:aws:athena:*:${AWS::AccountId}:workgroup/storage_lens_*'
              - Sid: StorageLensS3
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - 'arn:aws:s3:::aws-storage-lens-*'
                  - 'arn:aws:s3:::aws-storage-lens-*/*'

  # Función Lambda que hospeda el servidor MCP
  McpLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: bcm-mcp-server
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: index.handler
      Role: !GetAtt McpLambdaRole.Arn
      Timeout: 300
      MemorySize: 2048
      Environment:
        Variables:
          AWS_REGION_NAME: !Ref AwsRegionName
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Ref S3Key

  # API Gateway
  McpApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: bcm-mcp-server
      Description: 'Endpoint Streamable HTTP del servidor MCP de Billing & Cost Management'
      EndpointConfiguration:
        Types:
          - REGIONAL

  # Recurso /mcp
  McpResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref McpApi
      ParentId: !GetAtt McpApi.RootResourceId
      PathPart: mcp

  # POST /mcp
  McpPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref McpApi
      ResourceId: !Ref McpResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpLambdaFunction.Arn}/invocations'
        TimeoutInMillis: 29000

  # GET /mcp
  McpGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref McpApi
      ResourceId: !Ref McpResource
      HttpMethod: GET
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpLambdaFunction.Arn}/invocations'
        TimeoutInMillis: 29000

  # DELETE /mcp
  McpDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref McpApi
      ResourceId: !Ref McpResource
      HttpMethod: DELETE
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpLambdaFunction.Arn}/invocations'
        TimeoutInMillis: 29000

  # Permiso para que API Gateway invoque el Lambda
  McpLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt McpLambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${McpApi}/*/*'

  # Despliegue de la API
  McpApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - McpPostMethod
      - McpGetMethod
      - McpDeleteMethod
    Properties:
      RestApiId: !Ref McpApi

  # Stage de la API
  McpApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref McpApi
      DeploymentId: !Ref McpApiDeployment
      StageName: prod
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          MetricsEnabled: true
          LoggingLevel: INFO

  # API Key
  # Nota: la API queda protegida solo con API key, sin IAM ni autenticacion de usuario.
  # Alcanza para una demo, pero no lo dejes asi en un entorno productivo real.
  McpApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: McpApiStage
    Properties:
      Name: bcm-mcp-server-key
      Enabled: true
      StageKeys:
        - RestApiId: !Ref McpApi
          StageName: prod

  # Plan de uso
  McpUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: McpApiStage
    Properties:
      UsagePlanName: bcm-mcp-plan
      Throttle:
        RateLimit: 50
        BurstLimit: 100
      ApiStages:
        - ApiId: !Ref McpApi
          Stage: prod

  # Vincula la API Key al plan de uso
  McpUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref McpApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref McpUsagePlan

Outputs:
  McpEndpointUrl:
    Description: 'URL del endpoint MCP Streamable HTTP'
    Value: !Sub 'https://${McpApi}.execute-api.${AWS::Region}.amazonaws.com/prod/mcp'

  ApiKeyId:
    Description: 'ID de la API Key — para obtener el valor: aws apigateway get-api-key --api-key <id> --include-value'
    Value: !Ref McpApiKey
